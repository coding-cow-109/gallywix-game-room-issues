name: Idea or suggestion
description: A new game, a feature, or something that could be better
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What's your idea?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: How should it work? (optional)
      description: Any details, pictures or examples.
