name: Bug report
description: Something broke or doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: client
    attributes:
      label: Which game client?
      multiple: true
      options:
        - Classic Era
        - WoW Forever
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were doing, what you expected, and what happened instead.
      placeholder: Playing Deadmines Dig, I swapped a Pickaxe and the board froze.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error or screenshot (optional)
      description: Paste any error text (BugSack's minimap icon copies it), or drag in a screenshot.
